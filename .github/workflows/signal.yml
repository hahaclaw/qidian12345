name: qidian12345-signal

on:
  schedule:
    # GitHub cron 为 UTC 时间。北京 09:00-15:30 → UTC 01-07；夜盘 21:00-02:30 → UTC 13-18
    - cron: "*/15 1-7 * * 1-5"
    - cron: "*/15 13-18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scan.py
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          MIN_VOL: ${{ vars.MIN_VOL }}
          MIN_OI: ${{ vars.MIN_OI }}
      - name: 保存去重状态
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git commit -m "update state" || echo "no change"
          git pull --rebase || true
          git push
